name: zizmor

on:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zizmor:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: auditstream/.github/.github/workflows/reusable-zizmor.yml@a175503e97a978c4444faecc5cf258e3766529e2 # main
